name: playwright

# Not on PRs: smoke tests gate deploys, and can be run by hand on any branch from the Actions tab
on:
  # deploy.yaml calls this before every deploy and holds the deploy until it passes
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: read playwright version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: read
        name: Read version from the lockfile
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  playwright:
    name: smoke tests (${{ matrix.browser }})
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.version }}-noble
      options: --ipc=host
    env:
      # Firefox won't start as root unless HOME is root's own
      HOME: /root
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: xvfb-run -a npx playwright test --project=${{ matrix.browser }}
