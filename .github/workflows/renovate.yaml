name: renovate

on:
  schedule:
    - cron: "0 20 * * 5" # Fridays at noon PST
  workflow_dispatch:

concurrency:
  group: renovate

permissions: {}

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    steps:
      # The agar-helper app's token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger ci or playwright
      - id: app-token
        name: Get app token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AGAR_HELPER_CLIENT_ID }}
          private-key: ${{ secrets.AGAR_HELPER_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
