name: ci

on:
  pull_request:
  # Checks what actually landed, since main may have moved since the PR's run
  push:
    branches: [main]

# A newer commit on the same PR, or on main, cancels the run for the one it replaced
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: lint and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eslint, then prettier
      - name: Lint
        run: make lint

      # Runs even if lint failed, so one push reports both
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
