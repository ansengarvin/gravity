name: deploy

# Manual only, so a run of dependency merges ships as one deploy: Actions tab > deploy > Run workflow
on:
  workflow_dispatch:

# One deploy at a time; a newer run cancels a queued one but never an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: smoke tests
    # Run workflow lets you pick any branch; only main ships. Build and deploy are skipped with this.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/playwright.yaml
    permissions:
      contents: read

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
